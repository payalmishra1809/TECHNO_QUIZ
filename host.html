<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TECHNO QUIZ — Master Console</title>
<style>
  :root {
    --navy: #0b2545;
    --navy-2: #123465;
    --teal: #0e7c7b;
    --gold: #d4af37;
    --gold-2: #f0cf5a;
    --bg: #0a1220;
    --bg-2: #0f1b30;
    --card: #142544;
    --card-2: #1a2f56;
    --text: #eef2f8;
    --muted: #93a2ba;
    --good: #2ecc71;
    --bad: #e74c3c;
    --border: rgba(255,255,255,0.10);
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eef2f8; --bg-2: #e4ecf7; --card: #ffffff; --card-2: #f4f7fc;
      --text: #0b2545; --muted: #526080; --border: rgba(11,37,69,0.10);
    }
  }
  :root[data-theme="dark"] { --bg:#0a1220; --bg-2:#0f1b30; --card:#142544; --card-2:#1a2f56; --text:#eef2f8; --muted:#93a2ba; --border: rgba(255,255,255,0.10); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100%; background: radial-gradient(1200px 800px at 50% -10%, var(--bg-2), var(--bg));
    color: var(--text); font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 18px 18px 40px; }

  /* ---------- Header ---------- */
  header.top {
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding: 14px 18px; border-radius: 16px; margin-bottom:16px;
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    border: 1px solid var(--border); box-shadow: var(--shadow);
    flex-wrap: wrap;
  }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand .logo {
    width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    background: linear-gradient(135deg, var(--gold), var(--gold-2)); font-size:22px; box-shadow: 0 4px 14px rgba(212,175,55,0.4);
  }
  .brand h1 { margin:0; font-size: 22px; letter-spacing: 0.5px; color:#fff;}
  .brand p { margin:0; font-size:11.5px; color: #b9c6de; letter-spacing:1px; text-transform:uppercase;}
  .top-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .btn {
    border:1px solid var(--border); background: var(--card); color:var(--text);
    padding:9px 14px; border-radius:10px; font-size:13.5px; font-weight:600; cursor:pointer;
    transition: transform .08s ease, filter .15s ease; white-space:nowrap;
  }
  .btn:hover { filter:brightness(1.15); }
  .btn:active { transform: scale(0.96); }
  .btn.gold { background: linear-gradient(135deg,var(--gold),var(--gold-2)); color:#241a00; border:none; }
  .btn.teal { background: linear-gradient(135deg,var(--teal),#12a3a1); color:#fff; border:none; }
  .btn.good { background: linear-gradient(135deg,#2ecc71,#28b463); color:#04260f; border:none; }
  .btn.bad  { background: linear-gradient(135deg,#e74c3c,#c0392b); color:#2a0704; border:none; }
  .btn.ghost { background:transparent; }
  .btn.small { padding:6px 10px; font-size:12px; border-radius:8px; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }

  /* ---------- Round tabs ---------- */
  nav.rounds { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:16px; }
  nav.rounds button {
    flex: 0 0 auto; border:1px solid var(--border); background:var(--card); color:var(--muted);
    padding:10px 16px; border-radius:12px; font-weight:700; font-size:13px; cursor:pointer; white-space:nowrap;
  }
  nav.rounds button.active { background: linear-gradient(135deg,var(--teal),#0a5f5e); color:#fff; border-color:transparent; box-shadow: var(--shadow); }

  /* ---------- Scoreboard ---------- */
  .scoreboard { display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; margin-bottom:18px; }
  @media (max-width:820px){ .scoreboard{ grid-template-columns: repeat(2,1fr); } }
  .team-card {
    background: var(--card); border:1px solid var(--border); border-radius:14px; padding:10px 12px;
    display:flex; flex-direction:column; gap:4px; position:relative; overflow:hidden;
  }
  .team-card.finalist { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
  .team-card.buzzed { border-color: var(--teal); box-shadow: 0 0 0 2px var(--teal) inset; }
  .team-card .tname {
    font-size:13px; font-weight:700; background:transparent; border:none; color:var(--text);
    width:100%; padding:2px 0; outline:none;
  }
  .team-card .tscore { font-size: 24px; font-weight:800; color: var(--gold-2); }
  .team-card .tags { display:flex; gap:6px; font-size:10px; color:var(--muted); }
  .star-btn { position:absolute; top:8px; right:8px; background:none; border:none; cursor:pointer; font-size:14px; opacity:.5; }
  .star-btn.on { opacity:1; }

  /* ---------- View toggle & mini score strip ---------- */
  .view-toggle { display:flex; gap:10px; margin-bottom:16px; }
  .viewbtn { flex:1; padding:14px; border-radius:14px; border:1px solid var(--border); background:var(--card); color:var(--muted); font-weight:800; font-size:15px; cursor:pointer; }
  .viewbtn.active { background: linear-gradient(135deg,var(--teal),#0a5f5e); color:#fff; border-color:transparent; box-shadow: var(--shadow); }
  .mini-score { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .mini-chip { background:var(--card); border:1px solid var(--border); border-radius:999px; padding:6px 14px; font-size:12.5px; font-weight:700; cursor:pointer; display:flex; gap:6px; align-items:center; }
  .mini-chip .sc { color: var(--gold-2); font-weight:800; }
  .mini-chip.finalist { border-color: var(--gold); }

  /* ---------- Big scoreboard page ---------- */
  .board-big { display:flex; flex-direction:column; gap:10px; }
  .board-row { display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px 18px; box-shadow: var(--shadow); }
  .board-row.finalist { border-color: var(--gold); }
  .board-row .rank { font-size:22px; font-weight:900; width:40px; text-align:center; color: var(--muted); flex:0 0 auto; }
  .board-row .rank.medal { font-size:28px; }
  .board-row .bname { flex:1; min-width:0; font-size:19px; font-weight:700; background:transparent; border:none; color:var(--text); outline:none; border-bottom: 1px dashed transparent; padding:2px 0; }
  .board-row .bname:focus { border-bottom-color: var(--teal); }
  .board-row .bscore { font-size:28px; font-weight:900; color: var(--gold-2); min-width:64px; text-align:right; flex:0 0 auto; }
  .board-row .badj { display:flex; gap:4px; flex-wrap:wrap; flex:0 0 auto; }

  /* ---------- Modal ---------- */
  .modal-overlay { position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center; background: rgba(5,10,20,0.72); backdrop-filter: blur(2px); }
  .modal-box { background: var(--card); border:1px solid var(--border); border-radius:16px; padding:24px 26px; max-width:360px; text-align:center; box-shadow: var(--shadow); }
  .modal-msg { font-size:15px; font-weight:600; margin: 0 0 18px; }

  /* ---------- Stage ---------- */
  .stage {
    background: var(--card); border:1px solid var(--border); border-radius:18px; padding:26px;
    box-shadow: var(--shadow); min-height: 340px; position:relative;
  }
  .round-title { font-size:13px; text-transform:uppercase; letter-spacing:1.5px; color:var(--teal); font-weight:800; margin-bottom:6px; }
  .qcount { float:right; font-size:12px; color:var(--muted); font-weight:600; }
  .qtext { font-size: clamp(20px, 3vw, 30px); font-weight:750; line-height:1.35; margin: 10px 0 20px; }
  .tierpill { display:inline-block; font-size:11px; font-weight:800; padding:3px 10px; border-radius:999px; margin-bottom:10px; letter-spacing:.5px; }
  .tierpill.easy { background:#1f4d2f; color:#8beba0; }
  .tierpill.medium { background:#4d3d1f; color:#f0cf5a; }
  .tierpill.hard { background:#4d1f1f; color:#f09a9a; }

  .options { display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:14px; }
  @media (max-width:700px){ .options{ grid-template-columns: 1fr; } }
  .opt {
    border:1px solid var(--border); background: var(--card-2); border-radius:12px; padding:14px 16px;
    font-size:16px; font-weight:600; display:flex; gap:10px; align-items:center; transition: all .2s ease;
  }
  .opt .letter { width:26px;height:26px;border-radius:8px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800; flex:0 0 auto;}
  .opt.correct-reveal { background: linear-gradient(135deg,#1f6b3e,#2ecc71); color:#fff; border-color:transparent; animation: pop .4s ease; }
  .opt.correct-reveal .letter { background:#fff; color:#1f6b3e; }
  @keyframes pop { 0%{transform:scale(0.96);} 60%{transform:scale(1.04);} 100%{transform:scale(1);} }

  .answer-box { background: var(--card-2); border:1px dashed var(--border); border-radius:12px; padding:14px 16px; margin-bottom:14px; display:none; }
  .answer-box.show { display:block; animation: pop .35s ease; }
  .answer-box .lbl { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--teal); font-weight:800; margin-bottom:4px;}
  .answer-box .val { font-size:18px; font-weight:700; }

  .buzzgrid { display:grid; grid-template-columns: repeat(4,1fr); gap:10px; margin: 14px 0; }
  @media (max-width:820px){ .buzzgrid{ grid-template-columns: repeat(2,1fr);} }
  .buzzbtn {
    border:1px solid var(--border); background: var(--card-2); color: var(--text); border-radius:12px;
    padding:16px 8px; font-weight:800; font-size:14px; cursor:pointer; transition: all .12s ease;
  }
  .buzzbtn:hover:not(:disabled){ filter:brightness(1.2); transform: translateY(-2px); }
  .buzzbtn:disabled { opacity:.35; cursor:not-allowed; }
  .buzzbtn.active { background: linear-gradient(135deg, var(--teal), #0a5f5e); color:#fff; border-color:transparent; box-shadow:0 0 0 3px rgba(14,124,123,0.4); }
  .buzzbtn.locked-out { opacity:.25; }

  .controls-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:18px; padding-top:16px; border-top:1px solid var(--border); }
  .spacer { flex:1; }

  /* ---------- Rapid Fire ---------- */
  .rf-setup { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  select.teamsel { background:var(--card-2); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:9px 12px; font-weight:700; font-size:13.5px; }
  .timerbar { height:10px; border-radius:6px; background: var(--card-2); overflow:hidden; margin: 8px 0 18px; }
  .timerbar > div { height:100%; background: linear-gradient(90deg,var(--teal),var(--gold)); width:100%; transition: width 1s linear; }
  .timerdisp { font-size:42px; font-weight:900; color:var(--gold-2); text-align:center; margin-bottom:6px; font-variant-numeric: tabular-nums; }
  .rf-list { display:flex; flex-direction:column; gap:8px; }
  .rf-item { display:flex; align-items:center; gap:10px; background:var(--card-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .rf-item .rq { flex:1; font-size:14.5px; font-weight:600; }
  .rf-item.done-correct { border-color: var(--good); }
  .rf-item.done-wrong { opacity:.55; }
  .rf-tally { text-align:center; font-size:15px; font-weight:800; color:var(--gold-2); margin-top:10px; }

  /* ---------- Celebration overlay ---------- */
  #confetti-canvas { position:fixed; inset:0; pointer-events:none; z-index:60; display:none; }
  #celebrate-overlay {
    position:fixed; inset:0; z-index:61; display:none; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 40%, rgba(11,37,69,0.55), rgba(5,10,20,0.82));
    backdrop-filter: blur(2px);
  }
  #celebrate-overlay .banner {
    text-align:center; animation: bannerIn .5s cubic-bezier(.2,1.4,.4,1);
  }
  #celebrate-overlay .emoji { font-size: 76px; margin-bottom:6px; }
  #celebrate-overlay .msg { font-size: clamp(28px,5vw,54px); font-weight:900; color:#fff; text-shadow: 0 4px 24px rgba(0,0,0,0.5); letter-spacing:1px; }
  #celebrate-overlay .sub { font-size:16px; color: var(--gold-2); font-weight:700; margin-top:10px; letter-spacing:2px; text-transform:uppercase; }
  @keyframes bannerIn { 0%{ transform: scale(0.7) translateY(20px); opacity:0;} 100%{ transform:scale(1) translateY(0); opacity:1;} }

  #wrong-flash { position:fixed; inset:0; z-index:59; display:none; background: rgba(231,76,60,0.18); }

  /* ---------- Live phone buzzers ---------- */
  .quiz-grid { display:grid; grid-template-columns: minmax(0,1fr) 350px; gap:16px; align-items:start; }
  @media (max-width:1100px){ .quiz-grid{ grid-template-columns: 1fr; } }
  .buzz-panel { background: var(--card); border:1px solid var(--border); border-radius:18px; padding:16px; box-shadow: var(--shadow); }
  .bp-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .bp-title { font-size:13px; text-transform:uppercase; letter-spacing:1.5px; color:var(--teal); font-weight:800; }
  .bp-pill { font-size:11px; font-weight:900; padding:4px 10px; border-radius:999px; letter-spacing:1px; }
  .bp-pill.open { background:#1f4d2f; color:#8beba0; }
  .bp-pill.locked { background:#4d1f1f; color:#f09a9a; }
  .bp-meta { font-size:12.5px; color:var(--muted); margin-bottom:4px; }
  .bp-meta b { color:var(--text); letter-spacing:1px; }
  .bp-net { display:inline-block; width:9px; height:9px; border-radius:50%; background:#8a8f99; margin-right:4px; vertical-align:middle; }
  .bp-net.online { background:var(--good); box-shadow:0 0 6px var(--good); }
  .bp-net.connecting { background:var(--gold); }
  .bp-net.error { background:var(--bad); }
  .bp-msg { font-size:12px; color:var(--gold-2); margin:4px 0; }
  .bp-actions { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 12px; }
  .bp-list { display:flex; flex-direction:column; gap:6px; }
  .bp-row { display:grid; grid-template-columns: 34px minmax(0,1fr) auto auto; gap:8px; align-items:center; background:var(--card-2); border:1px solid var(--border); border-radius:10px; padding:8px 10px; animation: pop .3s ease; }
  .bp-row.first { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
  .bp-row.answering { border-color: var(--teal); box-shadow: 0 0 0 2px var(--teal) inset; }
  .bp-row.wrong { opacity:.45; }
  .bp-rank { font-size:18px; font-weight:900; text-align:center; color:var(--muted); }
  .bp-team { font-weight:700; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bp-team small { display:block; font-size:10.5px; font-weight:700; color:var(--muted); letter-spacing:.5px; }
  .bp-time { font-size:13px; font-weight:700; color:var(--muted); font-variant-numeric: tabular-nums; }
  .bp-gap { font-size:14px; font-weight:900; color:var(--gold-2); font-variant-numeric: tabular-nums; min-width:62px; text-align:right; }
  .bp-empty { color:var(--muted); font-size:13px; text-align:center; padding:18px 6px; border:1px dashed var(--border); border-radius:10px; }
  .mini-chip .dot { width:8px; height:8px; border-radius:50%; background:#6b7890; opacity:.5; }
  .mini-chip .dot.on { background:var(--good); opacity:1; box-shadow:0 0 6px var(--good); }
  .join-box { max-width:980px; width:calc(100% - 32px); max-height:90vh; overflow:auto; text-align:left; }
  .join-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px; }
  .join-head h3 { margin:0; font-size:18px; }
  .join-note { font-size:12.5px; color:var(--muted); margin:0 0 14px; }
  .join-note.warn { color:var(--gold-2); }
  .join-grid { display:grid; grid-template-columns: repeat(4,1fr); gap:10px; }
  @media (max-width:820px){ .join-grid{ grid-template-columns: repeat(2,1fr); } }
  .join-card { background:var(--card-2); border:1px solid var(--border); border-radius:12px; padding:10px; text-align:center; display:flex; flex-direction:column; gap:6px; align-items:center; }
  .join-card .jname { font-weight:800; font-size:14px; }
  .join-card img { width:100%; max-width:150px; height:auto; border-radius:6px; background:#fff; image-rendering:pixelated; }
  .join-card .jlink { font-size:10.5px; color:var(--muted); word-break:break-all; }

  footer.hint { text-align:center; color:var(--muted); font-size:12px; margin-top:22px; }
  .sound-toggle { display:flex; align-items:center; gap:6px; font-size:13px; color:#cfe0ff; }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>
<div id="wrong-flash"></div>
<div id="confirm-overlay" class="modal-overlay">
  <div class="modal-box">
    <p class="modal-msg" id="confirmMsg"></p>
    <div style="display:flex;gap:10px;justify-content:center;">
      <button class="btn bad" id="confirmYesBtn">Yes, Reset</button>
      <button class="btn ghost" id="confirmNoBtn">Cancel</button>
    </div>
  </div>
</div>
<div id="join-overlay" class="modal-overlay">
  <div class="modal-box join-box">
    <div class="join-head">
      <h3>📱 Team Buzzers · Room <span id="joinRoom"></span></h3>
      <button class="btn ghost small" id="joinCloseBtn">✕ Close</button>
    </div>
    <p class="join-note" id="joinNote"></p>
    <div class="join-grid" id="joinGrid"></div>
    <div style="display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:14px;">
      <span class="join-note" id="joinAny" style="margin:0;"></span>
      <button class="btn ghost small" id="joinNewRoomBtn">↻ New room code</button>
    </div>
  </div>
</div>
<div id="celebrate-overlay">
  <div class="banner">
    <div class="emoji" id="cel-emoji">🎉</div>
    <div class="msg" id="cel-msg">Correct!</div>
    <div class="sub" id="cel-sub"></div>
  </div>
</div>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">🏆</div>
      <div>
        <h1>TECHNO QUIZ</h1>
        <p>Master Console · Emerging Trends in Tech</p>
      </div>
    </div>
    <div class="top-actions">
      <label class="sound-toggle"><input type="checkbox" id="soundToggle" checked> 🔊 Sound</label>
      <button class="btn gold" id="btnChampion">🏆 Declare Champion</button>
      <button class="btn ghost" id="btnReset">↺ Reset All</button>
    </div>
  </header>

  <div class="view-toggle">
    <button id="viewQuizBtn" class="viewbtn active">🎮 Run Quiz</button>
    <button id="viewScoreBtn" class="viewbtn">🏆 Scoreboard</button>
  </div>

  <div id="quizView">
    <nav class="rounds" id="roundNav"></nav>
    <div class="mini-score" id="miniScore"></div>
    <div class="quiz-grid">
      <div class="stage" id="stage"></div>
      <aside class="buzz-panel" id="buzzPanel"></aside>
    </div>
  </div>

  <div id="scoreView" style="display:none;">
    <div class="board-big" id="boardBig"></div>
  </div>

  <footer class="hint" id="hintFooter">Tap a mini score chip to jump to the full Scoreboard, where you can rename teams, adjust points, and mark Grand-Finale finalists. State is saved automatically on this device.</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
(function(){
"use strict";

/* =========================================================
   QUESTION DATA
========================================================= */
const R1 = [ // Round 1 — Trend Trivia — Easy — simultaneous MCQ
  ["Which company developed the large language model ChatGPT?", ["OpenAI","Google","Microsoft","Meta"], 0],
  ["What does \u2018IoT\u2019 stand for?", ["Internet of Things","Input Output Technology","Integrated Online Tools","Interconnected Operating Terminals"], 0],
  ["Which emerging computing paradigm uses qubits instead of classical bits?", ["Cloud computing","Quantum computing","Edge computing","Neuromorphic computing"], 1],
  ["5G is the fifth generation of what kind of network technology?", ["Wi-Fi router technology","Fiber-optic cable technology","Mobile/cellular network technology","Satellite television technology"], 2],
  ["What term describes a decentralised digital ledger technology underlying cryptocurrencies?", ["Bitcoin","Blockchain","Cloud ledger","Data mesh"], 1],
  ["What does \u2018AR\u2019 stand for in tech circles?", ["Automated Response","Augmented Reality","Artificial Recognition","Analog Rendering"], 1],
  ["NPCI, India's UPI regulator body, stands for what?", ["National Public Currency Institute","New Payment Coordination India","National Payments Corporation of India","National Processing Cell of India"], 2],
  ["What is the term for AI models capable of generating text, images, or audio from prompts?", ["Predictive AI","Reactive AI","Analytical AI","Generative AI"], 3],
  ["Which chip company is best known for GPUs powering modern AI training?", ["Intel","NVIDIA","AMD","Qualcomm"], 1],
  ["What does \u2018ML\u2019 commonly stand for in the context of AI?", ["Model Logic","Machine Learning","Managed Learning","Meta Language"], 1],
];

const R2 = [ // Round 2 — Buzzer Blitz — Medium — buzzer, open answer
  ["Name the metaverse-focused rebrand of Facebook's parent company.", "Meta (Meta Platforms)"],
  ["What is the term for computing that happens near the data source rather than in a centralised cloud?", "Edge computing"],
  ["Which encryption approach is expected to be broken by sufficiently powerful quantum computers, prompting research into \u2018post-quantum cryptography\u2019?", "RSA / classical public-key encryption"],

/* =========================================================
   SOUND (Web Audio API — fully synthesized, no external files)
========================================================= */
let actx = null;
function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } } return actx; }
function tone(freq, start, dur, type, gain){
  const a = ac(); if(!a || state.muted) return;
  const osc = a.createOscillator(); const g = a.createGain();
  osc.type = type||"sine"; osc.frequency.value = freq;
  g.gain.value = 0;
  osc.connect(g); g.connect(a.destination);
  const t0 = a.currentTime + (start||0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain!=null?gain:0.22, t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function sndBuzz(){ tone(180,0,0.18,"sawtooth",0.25); }
function sndWrong(){ tone(260,0,0.14,"square",0.22); tone(160,0.13,0.22,"square",0.22); }
function sndCorrect(){ tone(523.25,0,0.14,"triangle",0.22); tone(659.25,0.12,0.14,"triangle",0.22); tone(783.99,0.24,0.22,"triangle",0.24); }
function sndTick(){ tone(880,0,0.05,"sine",0.12); }
function sndTimeUp(){ tone(220,0,0.3,"sawtooth",0.25); tone(160,0.28,0.4,"sawtooth",0.25); }
function sndFanfare(){
  const notes=[523.25,659.25,783.99,1046.5];
  notes.forEach((f,i)=> tone(f, i*0.16, 0.28, "triangle", 0.24));
  setTimeout(()=>{ notes.forEach((f,i)=> tone(f*1.02, i*0.1, 0.5, "sawtooth", 0.12)); }, 640);
}

/* =========================================================
   CONFETTI
========================================================= */
const confCanvas = document.getElementById("confetti-canvas");
const cctx = confCanvas.getContext("2d");
let confParticles = [], confAnimId = null;
function resizeCanvas(){ confCanvas.width = window.innerWidth; confCanvas.height = window.innerHeight; }
window.addEventListener("resize", resizeCanvas); resizeCanvas();
const CONF_COLORS = ["#d4af37","#0e7c7b","#eef2f8","#f0cf5a","#2ecc71","#e74c3c"];
function burstConfetti(big){
  const count = big? 220 : 90;
  for(let i=0;i<count;i++){
    confParticles.push({
      x: Math.random()*confCanvas.width, y: -20 - Math.random()*200,
      vx: (Math.random()-0.5)*(big?6:4), vy: 2+Math.random()*(big?6:4),
      size: 5+Math.random()*7, color: CONF_COLORS[Math.floor(Math.random()*CONF_COLORS.length)],
      rot: Math.random()*360, vrot: (Math.random()-0.5)*10, life: 0, maxLife: 180+Math.random()*80
    });
  }
  confCanvas.style.display = "block";
  if(!confAnimId) animateConfetti();
}
function animateConfetti(){
  cctx.clearRect(0,0,confCanvas.width, confCanvas.height);
  confParticles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.rot+=p.vrot; p.life++;
    cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.rot*Math.PI/180);
    cctx.fillStyle=p.color; cctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
    cctx.restore();
  });
  confParticles = confParticles.filter(p=> p.life < p.maxLife && p.y < confCanvas.height+40);
  if(confParticles.length>0){ confAnimId = requestAnimationFrame(animateConfetti); }
  else { confAnimId = null; confCanvas.style.display="none"; cctx.clearRect(0,0,confCanvas.width,confCanvas.height); }
}

    '<div class="answer-box" id="answerBox"><div class="lbl">Answer</div><div class="val">'+answer+'</div></div>' +
    '<div class="controls-row">' +
      '<button class="btn good" id="btnCorrect" disabled>✔ Correct (+'+cfg.scoring.correct+')</button>' +
      '<button class="btn bad" id="btnWrong" disabled>✘ Wrong ('+cfg.scoring.wrong+')</button>' +
      '<button class="btn teal" id="btnReveal">Reveal Answer</button>' +
      '<div class="spacer"></div>' +
      '<button class="btn ghost" id="btnPrev">\u2190 Prev</button>' +
      '<button class="btn ghost" id="btnNext">Next \u2192</button>' +
    '</div>';
  stageEl.appendChild(html);
  if(state.revealed) document.getElementById("answerBox").classList.add("show");

  buildBuzzGrid(document.getElementById("buzzGrid"), false);
  wireBuzzControls(cfg, ()=>{ state.revealed=true; render(); });

  document.getElementById("btnReveal").addEventListener("click", ()=>{
    state.revealed = true;
    document.getElementById("answerBox").classList.add("show");
  });
  document.getElementById("btnPrev").addEventListener("click", ()=> stepQuestion(cfg,-1));
  document.getElementById("btnNext").addEventListener("click", ()=> stepQuestion(cfg,1));
}

function buildBuzzGrid(container, finalistOnly){
  container.innerHTML = "";
  state.teams.forEach((t,i)=>{
    const eligible = !finalistOnly || t.finalist;
    const b = document.createElement("button");
    b.className = "buzzbtn" + (state.buzzed===i? " active":"") + (state.lockedOut.includes(i)? " locked-out":"");
    b.textContent = t.name;
    b.disabled = !eligible || state.lockedOut.includes(i) || (state.buzzed!==null && state.buzzed!==i);
    b.addEventListener("click", ()=>{
      state.buzzed = i; state.autoBuzz = false; sndBuzz(); render();
    });
    container.appendChild(b);
  });
}

function wireBuzzControls(cfg, afterCorrect){
  const btnC = document.getElementById("btnCorrect");
  const btnW = document.getElementById("btnWrong");
  if(!btnC || !btnW) return;
  const has = state.buzzed!==null;
  btnC.disabled = !has; btnW.disabled = !has;
  btnC.addEventListener("click", ()=>{
    if(state.buzzed===null) return;
    adjustScore(state.buzzed, cfg.scoring.correct);
    const name = state.teams[state.buzzed].name;
    buzz.resolved = true; lockBuzzers(); // question answered — stop taking presses
    afterCorrect();
    celebrate(name+" is correct!", "+"+cfg.scoring.correct+" points", "🎉", false);
    state.lockedOut = []; state.buzzed = null;
  });
  btnW.addEventListener("click", ()=>{
    if(state.buzzed===null) return;
    adjustScore(state.buzzed, cfg.scoring.wrong);
    flashWrong();
    state.lockedOut.push(state.buzzed);
    state.buzzed = null;
    autoPickBuzzed(); // pass to the next-fastest phone buzz, if any
    render();
  });
}

function stepQuestion(cfg, delta){
  const max = cfg.data.length;
  let ni = state.qIndex[cfg.id] + delta;
  if(ni<0) ni=0; if(ni>=max) ni=max-1;
  state.qIndex[cfg.id] = ni;
  state.buzzed=null; state.lockedOut=[]; state.revealed=false;
  resetBuzzers();
  saveState();
  render();
}

/* ---- Round 4: Rapid Fire ---- */
function renderRapidFire(cfg){
  stageEl.innerHTML = "";
  const html = document.createElement("div");
  html.innerHTML =
    '<div class="round-title">'+cfg.label+'</div>' +
    '<div class="tierpill medium">MIXED · 60-second individual sprint</div>' +
    '<div class="rf-setup">' +
      '<label style="font-size:13px;color:var(--muted);font-weight:700;">Team on the mic:</label>' +
      '<select class="teamsel" id="rfTeamSel"></select>' +
      '<button class="btn teal" id="btnDraw">🎲 Draw Set (2 Easy + 2 Medium + 1 Hard)</button>' +
      '<button class="btn gold" id="btnStart" disabled>▶ Start 60s Timer</button>' +
    '</div>' +
    '<div class="timerdisp" id="rfTimerDisp">60</div>' +
    '<div class="timerbar"><div id="rfTimerBar"></div></div>' +
    '<div class="rf-list" id="rfList"></div>' +
    '<div class="rf-tally" id="rfTally"></div>';
  stageEl.appendChild(html);

  const sel = document.getElementById("rfTeamSel");
  state.teams.forEach((t,i)=>{
    const o = document.createElement("option"); o.value=i; o.textContent=t.name;
    if(i===state.rf.teamIdx) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener("change", (e)=>{ state.rf.teamIdx = parseInt(e.target.value,10); });

  document.getElementById("btnDraw").addEventListener("click", drawRapidFireSet);
  document.getElementById("btnStart").addEventListener("click", startRapidFireTimer);

  renderRapidFireList();
  updateRfTimerDisplay();
}

function pickRandom(arr, n){
  const pool = arr.map((v,i)=>i);
  const chosen = [];
  while(chosen.length<n && pool.length>0){
    const idx = Math.floor(Math.random()*pool.length);
    chosen.push(pool.splice(idx,1)[0]);
  }
  return chosen.map(i=>arr[i]);
}
function drawRapidFireSet(){
  const easy = pickRandom(R4_EASY,2).map(q=>({q:q[0], a:q[1], tier:"easy"}));
  const med = pickRandom(R4_MEDIUM,2).map(q=>({q:q[0], a:q[1], tier:"medium"}));
  const hard = pickRandom(R4_HARD,1).map(q=>({q:q[0], a:q[1], tier:"hard"}));
  state.rf.set = easy.concat(med).concat(hard);
  state.rf.results = state.rf.set.map(()=>null);
  document.getElementById("btnStart").disabled = false;
  renderRapidFireList();
}
function renderRapidFireList(){
  const list = document.getElementById("rfList");
  if(!list) return;
  list.innerHTML = "";
  if(state.rf.set.length===0){
    list.innerHTML = '<p style="color:var(--muted);">Click "Draw Set" to generate this team\'s 5 rapid-fire questions.</p>';
    return;
  }
  state.rf.set.forEach((item,i)=>{
    const row = document.createElement("div");
    const res = state.rf.results[i];
    row.className = "rf-item" + (res==="correct"?" done-correct":"") + (res==="wrong"?" done-wrong":"");
    row.innerHTML =
      '<span class="tierpill '+item.tier+'" style="margin:0;">'+item.tier[0].toUpperCase()+'</span>' +
      '<span class="rq">'+item.q+' <em style="color:var(--muted);">— '+item.a+'</em></span>' +
      '<button class="btn small good" data-i="'+i+'" data-act="c">✔</button>' +
      '<button class="btn small bad" data-i="'+i+'" data-act="w">✘</button>';
    list.appendChild(row);
  });
  list.querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", (e)=>{
      const i = parseInt(e.currentTarget.getAttribute("data-i"),10);
      const act = e.currentTarget.getAttribute("data-act");
      state.rf.results[i] = act==="c" ? "correct" : "wrong";
      if(act==="c"){
        adjustScore(state.rf.teamIdx, currentRoundCfg().scoring.correct);
        sndCorrect();
      } else {
        flashWrong();
      }
      renderRapidFireList();
      updateRfTally();
    });
  });
  updateRfTally();
}
function updateRfTally(){
  const tallyEl = document.getElementById("rfTally");
  if(!tallyEl) return;
  const correctCount = state.rf.results.filter(r=>r==="correct").length;
  const answered = state.rf.results.filter(r=>r!==null).length;
  tallyEl.textContent = state.rf.set.length? (correctCount+" correct out of "+answered+" answered (+"+(correctCount*10)+" pts this sprint)") : "";
}
function updateRfTimerDisplay(){
  const d = document.getElementById("rfTimerDisp");
  const bar = document.getElementById("rfTimerBar");
  if(!d||!bar) return;
  d.textContent = state.rf.timeLeft;
  bar.style.width = Math.max(0,(state.rf.timeLeft/60*100))+"%";
}
function startRapidFireTimer(){
  if(state.rf.running) return;
  state.rf.timeLeft = 60; state.rf.running = true;
  updateRfTimerDisplay();
  state.rf.timerId = setInterval(()=>{
    state.rf.timeLeft--;
    updateRfTimerDisplay();
    if(state.rf.timeLeft<=5 && state.rf.timeLeft>0) sndTick();
    if(state.rf.timeLeft<=0){
      clearInterval(state.rf.timerId);
      state.rf.running = false;
      sndTimeUp();
    }
  }, 1000);
}

/* =========================================================
   GLOBAL CONTROLS
========================================================= */
document.getElementById("soundToggle").addEventListener("change", (e)=>{
  state.muted = !e.target.checked; saveState();
});
document.getElementById("btnReset").addEventListener("click", ()=>{
  showConfirm("Reset all scores, team names, and round progress? This cannot be undone.", ()=>{
    if(state.rf.timerId) clearInterval(state.rf.timerId);
    state.teams = Array.from({length:8}, (_,i)=>({ name:"Team "+(i+1), score:0, finalist:false }));
    ROUNDS.forEach(r=>{ state.qIndex[r.id]=0; });
    state.buzzed=null; state.lockedOut=[]; state.revealed=false;
    state.rf = { teamIdx:0, tier:{easy:[],medium:[],hard:[]}, set:[], results:[], timeLeft:60, running:false, timerId:null };
    resetBuzzers();
    saveState(); render();
  });
});

document.getElementById("viewQuizBtn").addEventListener("click", ()=> setView("quiz"));
document.getElementById("viewScoreBtn").addEventListener("click", ()=> setView("scoreboard"));
document.getElementById("btnChampion").addEventListener("click", ()=>{
  const sorted = state.teams.map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score);
  const top = sorted[0];
  if(!top) return;
  celebrate("🏆 "+top.name+" WINS! 🏆", "TECHNO QUIZ CHAMPION — "+top.score+" points", "🏆", true);
});

/* =========================================================
   LIVE PHONE BUZZERS (PeerJS / WebRTC — this console is the hub)
   Phones open buzzer.html?room=CODE&team=N. Each phone syncs its clock
   to this console, so presses are ranked by the moment the button was
   touched (in console time), not by network arrival order.
========================================================= */
const BUZZ_PEER_PREFIX = "technoquiz-buzz-";
const BUZZ_ROOM_KEY = "techno-quiz-buzz-room";
function bnow(){ return performance.timeOrigin + performance.now(); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function genRoomCode(){
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = "";
  for(let i=0;i<5;i++) s += A[Math.floor(Math.random()*A.length)];
  return s;
}
const buzz = {
  room:null, peer:null, conns:[], status:"offline", msg:"",
  open:true, rid:1, openedAt:bnow(), results:[], resolved:false, retryT:null
};
function loadBuzzRoom(){
  try{ buzz.room = localStorage.getItem(BUZZ_ROOM_KEY); }catch(e){}
  if(!buzz.room){ buzz.room = genRoomCode(); try{ localStorage.setItem(BUZZ_ROOM_KEY, buzz.room); }catch(e){} }
}
function setBuzzStatus(status, msg){ buzz.status = status; buzz.msg = msg||""; renderBuzzPanel(); }
function scheduleBuzzRetry(fn, ms){ clearTimeout(buzz.retryT); buzz.retryT = setTimeout(fn, ms); }

function startBuzzHost(){
  clearTimeout(buzz.retryT);
  if(typeof Peer === "undefined"){
    setBuzzStatus("error", "Buzzer library failed to load — check the internet connection and reload.");
    return;
  }
  if(buzz.peer){ const old = buzz.peer; buzz.peer = null; try{ old.destroy(); }catch(e){} }
  setBuzzStatus("connecting", "Connecting to buzzer network…");
  const peer = new Peer(BUZZ_PEER_PREFIX + buzz.room, { debug:0 });
  buzz.peer = peer;
  peer.on("open", ()=>{ if(peer===buzz.peer) setBuzzStatus("online", ""); });
  peer.on("connection", conn=>{ if(peer===buzz.peer) setupBuzzConn(conn); });
  peer.on("disconnected", ()=>{
    if(peer!==buzz.peer || peer.destroyed) return;
    setBuzzStatus("connecting", "Lost buzzer server — reconnecting… (connected phones keep working)");
    scheduleBuzzRetry(()=>{
      if(peer!==buzz.peer || peer.destroyed || !peer.disconnected) return;
      try{ peer.reconnect(); }catch(e){ startBuzzHost(); }
    }, 2000);
  });
  peer.on("error", err=>{
    if(peer!==buzz.peer) return;
    const type = err && err.type;
    if(type === "unavailable-id"){
      setBuzzStatus("connecting", "Room "+buzz.room+" is still held by an old session (another tab?) — retrying…");
      scheduleBuzzRetry(startBuzzHost, 5000);
    } else if(type === "browser-incompatible"){
      setBuzzStatus("error", "This browser doesn't support WebRTC buzzers. Use Chrome, Edge or Safari.");
    } else if(peer.destroyed){
      setBuzzStatus("connecting", "Buzzer network error — retrying…");
      scheduleBuzzRetry(startBuzzHost, 3000);
    }
    // other errors (a single phone failing) are handled per-connection
  });
}

function setupBuzzConn(conn){
  conn.team = null; conn.lastSeen = bnow();
  conn.on("open", ()=>{
    if(!buzz.conns.includes(conn)) buzz.conns.push(conn);
    conn.lastSeen = bnow();
    sendBuzzState(conn);
  });
  conn.on("data", d=> onBuzzMsg(conn, d));
  const drop = ()=>{
    const i = buzz.conns.indexOf(conn);
    if(i>=0){ buzz.conns.splice(i,1); renderBuzzConnections(); }
  };
  conn.on("close", drop); conn.on("error", drop);
}
function safeSend(conn, msg){ try{ if(conn.open) conn.send(msg); }catch(e){} }

function onBuzzMsg(conn, d){
  if(!d || typeof d !== "object") return;
  conn.lastSeen = bnow();
  if(d.type === "ping"){ safeSend(conn, { type:"pong", t0:d.t0, th:bnow() }); return; }
  if(d.type === "hello"){
    const t = parseInt(d.team, 10);
    const before = conn.team;
    conn.team = (t>=0 && t<state.teams.length) ? t : null;
    sendBuzzState(conn);
    if(before !== conn.team) renderBuzzConnections();
    return;
  }
  if(d.type === "buzz") handlePhoneBuzz(conn, d);
}

function isBuzzEligible(team){
  const cfg = currentRoundCfg();
  return !cfg.finalistOnly || !!state.teams[team].finalist;
}
function teamConnected(i){
  if(typeof buzz === "undefined") return false;
  const n = bnow();
  return buzz.conns.some(c=> c.open && c.team===i && n-(c.lastSeen||0) < 15000);
}

function handlePhoneBuzz(conn, d){
  const arrival = bnow();
  const team = conn.team;
  if(team === null) return;
  if(!buzz.open || d.rid !== buzz.rid || !isBuzzEligible(team) || buzz.results.some(r=>r.team===team)){
    sendBuzzState(conn); return;
  }
  // Phone reports the touch moment in console-clock time. Trust it within a
  // sane window (never later than arrival, at most 1s earlier), else use arrival.
  let t = arrival;
  if(d.synced && typeof d.t === "number" && isFinite(d.t)) t = Math.min(arrival, Math.max(arrival-1000, d.t));
  t = Math.max(t, buzz.openedAt);
  buzz.results.push({ team, t, ms: t - buzz.openedAt });
  buzz.results.sort((a,b)=> a.t - b.t);
  if(buzz.results.length === 1) sndBuzz();
  broadcastBuzzState();
  if(autoPickBuzzed()) render(); else renderBuzzPanel();
}

/* In buzzer rounds, the fastest eligible, not-yet-wrong team gets the mic.
   A manual pick by the host (clicking a team button) is respected. */
function autoPickBuzzed(){
  const cfg = currentRoundCfg();
  if(cfg.type !== "buzzer" && cfg.type !== "mcq-buzzer") return false;
  if(buzz.resolved) return false;
  if(state.buzzed !== null && !state.autoBuzz) return false;
  const next = buzz.results.find(r=> !state.lockedOut.includes(r.team) && isBuzzEligible(r.team));
  const val = next ? next.team : null;
  if(val === state.buzzed) return false;
  state.buzzed = val; state.autoBuzz = val !== null;
  return true;
}

function buzzStateMsg(){
  const cfg = currentRoundCfg();
  return {
    type:"state", rid:buzz.rid, open:buzz.open, round:cfg.label,
    teams: state.teams.map(t=>t.name),
    eligible: state.teams.map((t,i)=> isBuzzEligible(i)),
    results: buzz.results.map(r=>({ team:r.team, ms:Math.round(r.ms) }))
  };
}
function sendBuzzState(conn){ safeSend(conn, buzzStateMsg()); }
function broadcastBuzzState(){
  if(typeof buzz === "undefined" || !buzz.conns.length) return;
  const msg = buzzStateMsg();
  buzz.conns.forEach(c=> safeSend(c, msg));
}

function resetBuzzers(){
  buzz.rid++; buzz.open = true; buzz.openedAt = bnow();
  buzz.results = []; buzz.resolved = false; state.autoBuzz = false;
  broadcastBuzzState(); renderBuzzPanel();
}
function lockBuzzers(){ buzz.open = false; broadcastBuzzState(); renderBuzzPanel(); }
function reopenBuzzers(){ buzz.open = true; broadcastBuzzState(); renderBuzzPanel(); }

function renderBuzzConnections(){ renderMiniScore(); renderBuzzPanel(); }

// Drop phones that went silent (screen off, lost network) so the green dots stay honest
setInterval(()=>{
  const n = bnow(); let changed = false;
  buzz.conns.slice().forEach(c=>{
    if(n-(c.lastSeen||0) > 25000){ try{ c.close(); }catch(e){} const i = buzz.conns.indexOf(c); if(i>=0){ buzz.conns.splice(i,1); changed = true; } }
  });
  if(changed) renderBuzzConnections();
}, 5000);

const buzzPanelEl = document.getElementById("buzzPanel");
function fmtSec(ms){ return (ms/1000).toFixed(3)+"s"; }
function renderBuzzPanel(){
  if(!buzzPanelEl || typeof buzz === "undefined") return;
  const connectedTeams = state.teams.filter((t,i)=> teamConnected(i)).length;
  const medals = ["🥇","🥈","🥉"];
  const leader = buzz.results[0];
  let rows = "";
  buzz.results.forEach((r, k)=>{
    const wrong = state.lockedOut.includes(r.team);
    const answering = state.buzzed === r.team;
    const elig = isBuzzEligible(r.team);
    const tag = answering ? "🎤 ANSWERING" : wrong ? "✘ WRONG" : !elig ? "NOT A FINALIST" : "";
    rows +=
      '<div class="bp-row'+(k===0?" first":"")+(answering?" answering":"")+(wrong?" wrong":"")+'">' +
        '<span class="bp-rank">'+(k<3? medals[k] : (k+1))+'</span>' +
        '<span class="bp-team">'+esc(state.teams[r.team].name)+(tag?'<small>'+tag+'</small>':'')+'</span>' +
        '<span class="bp-time" title="Time since buzzers opened">'+fmtSec(r.ms)+'</span>' +
        '<span class="bp-gap">'+(k===0? "⚡ FIRST" : "+"+fmtSec(r.t - leader.t))+'</span>' +
      '</div>';
  });
  if(!rows){
    rows = '<div class="bp-empty">' + (buzz.open ? "Buzzers are live — waiting for the first press…" : "Buzzers locked. Press Reset to open them.") + '</div>';
  }
  buzzPanelEl.innerHTML =
    '<div class="bp-head"><div class="bp-title">📱 Live Buzzers</div>' +
      '<span class="bp-pill '+(buzz.open?"open":"locked")+'">'+(buzz.open?"● OPEN":"🔒 LOCKED")+'</span></div>' +
    '<div class="bp-meta"><span class="bp-net '+buzz.status+'"></span>Room <b>'+esc(buzz.room)+'</b> · '+connectedTeams+'/'+state.teams.length+' teams connected</div>' +
    (buzz.msg ? '<div class="bp-msg">'+esc(buzz.msg)+'</div>' : '') +
    '<div class="bp-actions">' +
      '<button class="btn gold small" id="bpReset">↺ Reset Buzzers</button>' +
      '<button class="btn small" id="bpLock">'+(buzz.open?"🔒 Lock":"🔓 Open")+'</button>' +
      '<button class="btn teal small" id="bpJoin">🔗 Join Links / QR</button>' +
    '</div>' +
    '<div class="bp-list">'+rows+'</div>';
  document.getElementById("bpReset").onclick = ()=>{
    const cfg = currentRoundCfg();
    if(cfg.type==="buzzer" || cfg.type==="mcq-buzzer"){ state.buzzed = null; state.lockedOut = []; }
    resetBuzzers(); render();
  };
  document.getElementById("bpLock").onclick = ()=>{ buzz.open ? lockBuzzers() : reopenBuzzers(); };
  document.getElementById("bpJoin").onclick = openJoinModal;
}

/* ---- Join links + QR codes ---- */
const joinOverlay = document.getElementById("join-overlay");
function joinUrl(teamIdx){
  const u = new URL("buzzer.html", location.href);
  u.search = "?room="+encodeURIComponent(buzz.room) + (teamIdx!=null ? "&team="+(teamIdx+1) : "");
  u.hash = "";
  return u.toString();
}
function qrImg(url){
  if(typeof qrcode === "undefined") return "";
  try{ const q = qrcode(0, "M"); q.addData(url); q.make(); return q.createImgTag(4, 8); }catch(e){ return ""; }
}
function openJoinModal(){
  document.getElementById("joinRoom").textContent = buzz.room;
  const note = document.getElementById("joinNote");
  if(location.protocol === "file:"){
    note.className = "join-note warn";
    note.textContent = "⚠ This console is opened from a local file, so phones can't open these links. Open the console from its GitHub Pages URL (…github.io/TECHNO_QUIZ/host.html) instead.";
  } else {
    note.className = "join-note";
    note.textContent = "Each team scans its own QR code (or opens the link) on one phone. A green dot on the team chip means that phone is connected. Keep this console tab open during the quiz.";
  }
  const grid = document.getElementById("joinGrid");
  grid.innerHTML = "";
  state.teams.forEach((t,i)=>{
    const url = joinUrl(i);
    const card = document.createElement("div");
    card.className = "join-card";
    card.innerHTML =
      '<div class="jname">'+(teamConnected(i)?"🟢 ":"")+esc(t.name)+'</div>' + qrImg(url) +
      '<div class="jlink">'+esc(url)+'</div>' +
      '<button class="btn small ghost">📋 Copy link</button>';
    card.querySelector("button").onclick = (e)=>{
      const btn = e.currentTarget;
      const done = ()=>{ btn.textContent = "✔ Copied"; setTimeout(()=>{ btn.textContent = "📋 Copy link"; }, 1500); };
      if(navigator.clipboard) navigator.clipboard.writeText(url).then(done, ()=>{});
    };
    grid.appendChild(card);
  });
  document.getElementById("joinAny").textContent = "Generic link (team picks on phone): " + joinUrl(null);
  joinOverlay.style.display = "flex";
}
document.getElementById("joinCloseBtn").onclick = ()=>{ joinOverlay.style.display = "none"; };
joinOverlay.addEventListener("click", (e)=>{ if(e.target === joinOverlay) joinOverlay.style.display = "none"; });
document.getElementById("joinNewRoomBtn").onclick = ()=>{
  joinOverlay.style.display = "none";
  showConfirm("Create a new room code? All phones will disconnect and must re-scan.", ()=>{
    buzz.conns.slice().forEach(c=>{ try{ c.close(); }catch(e){} });
    buzz.conns = [];
    buzz.room = genRoomCode();
    try{ localStorage.setItem(BUZZ_ROOM_KEY, buzz.room); }catch(e){}
    startBuzzHost(); renderMiniScore(); openJoinModal();
  });
};

/* =========================================================
   INIT
========================================================= */
loadBuzzRoom();
loadState();
document.getElementById("soundToggle").checked = !state.muted;
render();
startBuzzHost();

})();
